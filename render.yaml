services:
  - type: web
    name: shreyash-writes
    env: node
    branch: main
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_SITE_URL
        value: https://shreyash.writes.onrender.com
      - key: NODE_VERSION
        value: "20"